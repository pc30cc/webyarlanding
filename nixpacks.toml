providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"
CI = "true"
# Build a plain Node server (dist/server/index.mjs) instead of the Cloudflare bundle.
NITRO_PRESET = "node-server"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
# Nitro node-server output: dist/server/index.mjs serves SSR + dist/client assets.
cmd = "node dist/server/index.mjs"
