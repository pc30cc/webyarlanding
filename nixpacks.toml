providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"
CI = "true"
# Build a plain Node server (dist/server/index.mjs) instead of the Cloudflare bundle.
NITRO_PRESET = "node-server"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
# بعد از build وابستگی‌های توسعه و cacheها پاک می‌شوند تا حجم image کم شود.
# node_modules/.cache را پاک نکنید: nixpacks آن را به‌صورت cache mount وصل می‌کند
# (پاک کردنش خطای "Device or resource busy" می‌دهد) و به هر حال وارد image نمی‌شود.
cmds = ["npm run build", "npm prune --omit=dev", "rm -rf /tmp/node-compile-cache /root/.npm/_cacache"]

[start]
# Nitro node-server output: dist/server/index.mjs serves SSR + dist/client assets.
# --env-file-if-exists لود می‌کند .env در صورت وجود؛ متغیرهای Coolify اولویت دارند.
cmd = "node --env-file-if-exists=.env dist/server/index.mjs"
